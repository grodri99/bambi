# Compila Bambi en cada push y pull request (y a mano desde la pestaña Actions).
# Sin claves: local.properties no está en git, así que el APK sale sin claves precargadas (como seedKeys=false)
# y firmado con la clave de depuración. Sirve para comprobar que todo compila, no para publicar.
name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Desde Windows, gradlew puede llegar a git sin permiso de ejecución.
      - run: chmod +x gradlew

      - name: Compilar (debug) y pasar los tests
        run: ./gradlew --no-daemon assembleDebug :core:model:test :core:domain:test testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: Bambi-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
