# Build Franklix on every push and pull request, and manually from the Actions tab.
# Without credentials: local.properties is not tracked, so the APK contains no preloaded keys
# (equivalent to seedKeys=false) and is signed with the debug key. This validates the build; it does not publish it.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # On Windows, git may check out gradlew without the executable bit.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug :core:model:test :core:domain:test testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Franklix-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
