name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example, v1.0.7)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag matches versionName
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must use the vX.Y.Z format: $RELEASE_TAG"
            exit 1
          }
          APP_VERSION=$(awk -F'"' '/versionName = / {print $2; exit}' app/build.gradle.kts)
          [[ "$APP_VERSION" == "${RELEASE_TAG#v}" ]] || {
            echo "versionName ($APP_VERSION) does not match $RELEASE_TAG"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Configure signing and local properties
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TRAKT_ID: ${{ vars.TRAKT_CLIENT_ID }}
          TRAKT_URI: ${{ vars.TRAKT_REDIRECT_URI }}
          ITHIL_METADATA: ${{ secrets.ITHIL_METADATA_URL }}
          ITHIL_KEY: ${{ secrets.ITHIL_INDEX_KEY }}
          ITHIL_PREFIX: ${{ secrets.ITHIL_ARCHIVE_PREFIX }}
        run: |
          : "${KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing RELEASE_STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD}"
          : "${KEY_ALIAS:?Missing RELEASE_KEY_ALIAS}"
          : "${TRAKT_ID:?Missing TRAKT_CLIENT_ID variable}"
          : "${TRAKT_URI:?Missing TRAKT_REDIRECT_URI variable}"
          : "${ITHIL_METADATA:?Missing ITHIL_METADATA_URL secret}"
          : "${ITHIL_KEY:?Missing ITHIL_INDEX_KEY secret}"
          : "${ITHIL_PREFIX:?Missing ITHIL_ARCHIVE_PREFIX secret}"
          KEYSTORE="$RUNNER_TEMP/keystore/franklix.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'seedKeys=false\n'
            printf 'releaseStoreFile=%s\n' "$KEYSTORE"
            printf 'releaseStorePassword=%s\n' "$STORE_PASSWORD"
            printf 'releaseKeyAlias=%s\n' "$KEY_ALIAS"
            printf 'releaseKeyPassword=%s\n' "$KEY_PASSWORD"
            printf 'traktClientId=%s\n' "$TRAKT_ID"
            printf 'traktRedirectUri=%s\n' "$TRAKT_URI"
            printf 'ithilMetadataUrl=%s\n' "$ITHIL_METADATA"
            printf 'ithilIndexKey=%s\n' "$ITHIL_KEY"
            printf 'ithilArchivePrefix=%s\n' "$ITHIL_PREFIX"
          } > local.properties
          chmod 600 local.properties "$KEYSTORE"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleRelease :core:model:test :core:domain:test testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Prepare Franklix.apk
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release-artifact/Franklix.apk"
          test -s "$RUNNER_TEMP/release-artifact/Franklix.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-artifact/Franklix.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest \
            --verify-tag
