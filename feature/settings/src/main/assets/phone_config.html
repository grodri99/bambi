<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Franklix · Phone configuration</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#101119;color:#f5f5f7;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:860px;margin:auto;padding:28px 18px 56px}.brand{display:flex;align-items:center;gap:14px}.brand-logo{width:72px;height:72px;object-fit:contain;border-radius:14px}header{margin-bottom:24px}h1{font-size:30px;margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}p{color:#a7a9b5;line-height:1.45}.card{background:#1a1c27;border:1px solid #2a2d3d;border-radius:14px;padding:16px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.grow{flex:1}label{font-weight:600}small,.muted{color:#9699a8}a{color:#75bfff}input[type=password],select{width:100%;margin-top:12px;padding:13px;border-radius:9px;border:1px solid #3b3e50;background:#101119;color:#fff;font:inherit}input:focus,select:focus{outline:2px solid #fff}input[type=checkbox]{width:22px;height:22px;accent-color:#e50914;flex:none}.check{display:flex;align-items:center;gap:12px;cursor:pointer}.key-status{font-size:13px;color:#8bd59c}.key-status.off{color:#f5b83d}.key-actions{display:flex;gap:12px;align-items:center}.link{font-size:14px}button{border:0;border-radius:10px;padding:13px 18px;background:#fff;color:#101119;font-weight:700;font:inherit;cursor:pointer}button.secondary{background:#303344;color:#fff}button.danger{background:#44282e;color:#ffb4b8}button:disabled{opacity:.5}.actions{position:sticky;bottom:0;display:flex;gap:12px;padding:12px 0;background:#101119}.actions button{padding:16px}.actions .primary{flex:1;background:#e50914;color:#fff;box-shadow:0 8px 28px #000}.status{min-height:28px;padding:8px 0;font-weight:600}.error{color:#ff8c91}.success{color:#72db91}.field-error{font-size:14px;margin:10px 0 0}.removal{color:#f5b83d;font-size:14px;margin:12px 0 0}.hidden{display:none}.footer{font-size:13px;margin-top:22px}.wizard{display:flex;justify-content:space-between;align-items:start;gap:18px;margin:26px 0 16px}.wizard h2{margin-bottom:6px}.wizard p{margin:0}.step-counter{white-space:nowrap;color:#f5b83d;font-size:14px}.steps{display:flex;gap:7px;margin-bottom:22px}.step-dot{height:5px;flex:1;border-radius:4px;background:#303344}.step-dot.active{background:#e50914}.completion{text-align:center;padding:36px 22px;margin-top:32px}.checkmark{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 18px;border-radius:50%;background:#46d369;color:#101119;font-size:40px;font-weight:800}.completion h2{margin-bottom:8px}.completion p{margin:0}.section-heading{margin-top:30px}.section-heading p{margin:4px 0 12px}@media(max-width:520px){main{padding:20px 12px 44px}.row{align-items:flex-start}.key-actions{flex-direction:column;align-items:flex-end}h1{font-size:26px}.card{padding:14px}.wizard{gap:10px}.wizard h2{font-size:20px}}
</style>
</head>
<body><main>
<header class="brand"><img class="brand-logo" src="/logo.png" alt=""><div><h1>Franklix</h1><p id="subtitle">Phone configuration</p></div></header>
<div id="status" class="status" role="status" aria-live="polite">Loading…</div>
<section id="setup-wizard" class="hidden" aria-label="Setup progress">
  <div class="wizard"><div><h2 id="step-title"></h2><p id="step-intro" class="muted"></p></div><strong id="step-counter" class="step-counter"></strong></div>
  <div id="step-dots" class="steps" aria-hidden="true"></div>
</section>
<section id="completion" class="card completion hidden">
  <div class="checkmark">✓</div><h2 id="completion-title"></h2><p id="completion-body"></p>
</section>
<form id="form" class="hidden">
  <section id="debrid-section" class="card"><label id="debrid-label" for="debrid"></label><select id="debrid"></select></section>
  <section id="keys-section" class="section-heading"><h2 id="keys-title"></h2><p id="keys-help" class="muted"></p></section>
  <div id="keys"></div>
  <section id="providers-section"><h2 id="providers-title" class="section-heading"></h2><div id="providers"></div></section>
  <section id="preferences-section"><h2 id="preferences-title" class="section-heading"></h2><div id="preferences"></div></section>
  <section id="setup-fields" class="hidden">
    <div class="card"><label id="language-label" for="setup-language"></label><select id="setup-language"></select></div>
    <div class="card"><label id="audio-label" for="setup-audio"></label><select id="setup-audio"></select></div>
    <div class="card"><label id="subtitles-label" for="setup-subtitles"></label><select id="setup-subtitles"></select></div>
  </section>
  <p id="form-error" class="error" role="alert"></p>
  <div class="actions"><button id="back" class="secondary hidden" type="button"></button><button id="save" class="primary" type="submit"></button></div>
</form>
<p id="footer" class="footer muted"></p>
</main>
<script>
'use strict';
const token=location.hash.replace(/^#/,'');
const $=id=>document.getElementById(id);
let config=null,keyChanges=new Map(),saving=false,setupStep=1,setupFinished=false;
const english={subtitle:'Configuration on this TV',loading:'Loading configuration…',debrid:'Debrid service',debridLabel:'Service in use',keys:'Service keys',keysHelp:'Existing secrets stay hidden. Leave a field blank to keep its current value.',providers:'Source finders',preferences:'Preferences',lightweightUi:'Lightweight UI',experimentalSubtitleSync:'Experimental subtitle sync',autoNextEpisode:'Autoplay next episode',save:'Save configuration',next:'Next',back:'Back',finish:'Finish setup',saving:'Validating and saving…',saved:'Saved on the TV.',loadError:'Could not load the configuration.',saveError:'Could not save the configuration.',session:'This page works only during the temporary TV session. Keep the TV screen open.',configured:'Configured',notConfigured:'Not configured',newValue:'New value',keep:'Leave blank to keep the current value',remove:'Remove',undo:'Undo',willRemove:'Will be removed when you save.',getKey:'Where to get it',required:'Required',network:'Connection lost. Check that the TV screen is still open.',invalid:'Fix the highlighted fields and try again.',setupSubtitle:'First-run setup for this TV',setupPreferences:'Language, audio & subtitles',interfaceLanguage:'Interface language',preferredAudio:'Preferred audio',automaticSubtitles:'Automatic subtitles',audioOriginal:'Original',audioSpanish:'Spanish',audioSpanishOnly:'Spanish only',subtitlesOff:'Off',subtitlesSpanish:'Spanish',subtitlesEnglish:'English',ready:'Your Franklix setup is ready.',finishOnTv:'Return to the TV and choose “Finish setup”.',step:'Step {0} of 4',catalog:'Catalog',catalogIntro:'Add TMDB for artwork, synopses, seasons and age ratings.',debridIntro:'Choose your debrid service and connect its API key.',extraSubtitles:'Extra subtitles',subtitlesIntro:'Optional: add SubDL for more external subtitles.',preferencesIntro:'Choose the language, audio and subtitles for this profile.',keyRequired:'Enter the required key or choose it on the TV.',pairing:'The connection works, but this link has no access token. Scan the QR shown on the TV.'};
const spanish={subtitle:'Configuración de esta TV',loading:'Cargando configuración…',debrid:'Servicio debrid',debridLabel:'Servicio en uso',keys:'Claves de los servicios',keysHelp:'Las claves actuales permanecen ocultas. Deja un campo vacío para conservar su valor.',providers:'Buscadores de fuentes',preferences:'Preferencias',lightweightUi:'Interfaz ligera',experimentalSubtitleSync:'Sincronización experimental de subtítulos',autoNextEpisode:'Siguiente episodio automático',save:'Guardar configuración',next:'Siguiente',back:'Atrás',finish:'Terminar configuración',saving:'Comprobando y guardando…',saved:'Guardado en la TV.',loadError:'No se pudo cargar la configuración.',saveError:'No se pudo guardar la configuración.',session:'Esta página solo funciona durante la sesión temporal de la TV. Mantén abierta la pantalla de la TV.',configured:'Configurada',notConfigured:'Sin configurar',newValue:'Nuevo valor',keep:'Déjalo vacío para conservar el valor actual',remove:'Eliminar',undo:'Deshacer',willRemove:'Se eliminará al guardar.',getKey:'Dónde conseguirla',required:'Necesaria',network:'Se perdió la conexión. Comprueba que la pantalla de la TV sigue abierta.',invalid:'Corrige los campos marcados e inténtalo de nuevo.',setupSubtitle:'Configuración inicial de esta TV',setupPreferences:'Idioma, audio y subtítulos',interfaceLanguage:'Idioma de la interfaz',preferredAudio:'Audio preferido',automaticSubtitles:'Subtítulos automáticos',audioOriginal:'Original',audioSpanish:'Español',audioSpanishOnly:'Solo español',subtitlesOff:'Desactivados',subtitlesSpanish:'Español',subtitlesEnglish:'Inglés',ready:'La configuración de Franklix está lista.',finishOnTv:'Vuelve a la TV y pulsa «Terminar configuración».',step:'Paso {0} de 4',catalog:'Catálogo',catalogIntro:'Añade TMDB para las portadas, sinopsis, temporadas y edades recomendadas.',debridIntro:'Elige tu servicio debrid y conecta su clave de API.',extraSubtitles:'Subtítulos extra',subtitlesIntro:'Opcional: añade SubDL para disponer de más subtítulos externos.',preferencesIntro:'Elige el idioma, el audio y los subtítulos de este perfil.',keyRequired:'Escribe la clave necesaria o elígela en la TV.',pairing:'La conexión funciona, pero este enlace no tiene el código de acceso. Escanea el QR que aparece en la TV.'};
let t=navigator.language.toLowerCase().startsWith('es')?spanish:english;
function setText(id,text){$(id).textContent=text}
function status(text,kind=''){const el=$('status');el.textContent=text;el.className='status '+kind}
function applyLanguage(){
  document.documentElement.lang=t===spanish?'es':'en';
  setText('subtitle',config&&config.setup?t.setupSubtitle:t.subtitle);
  setText('debrid-label',t.debridLabel);setText('keys-title',t.keys);setText('keys-help',t.keysHelp);
  setText('providers-title',t.providers);setText('preferences-title',t.preferences);
  setText('language-label',t.interfaceLanguage);setText('audio-label',t.preferredAudio);setText('subtitles-label',t.automaticSubtitles);
  setText('footer',t.session);setText('back',t.back);
  setText('save',config&&config.setup?(setupStep===4?t.finish:t.next):t.save);
}
async function api(options={}){
  const response=await fetch('/api/config',{...options,headers:{...options.headers,'Authorization':'Bearer '+token,'Cache-Control':'no-cache'}});
  let body={};try{body=await response.json()}catch{}
  if(!response.ok){const error=new Error(body.error||'request_failed');error.body=body;error.status=response.status;throw error}
  return body;
}
function element(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function fillSelect(id,options,current,onChange){
  const select=$(id);select.replaceChildren();
  for(const [value,title] of options){const option=document.createElement('option');option.value=value;option.textContent=title;option.selected=value===current;select.append(option)}
  select.onchange=()=>onChange(select.value);
}
function setupInfo(){
  return [null,
    {title:t.catalog,intro:t.catalogIntro,service:'TMDB'},
    {title:t.debrid,intro:t.debridIntro,service:config.debrid},
    {title:t.extraSubtitles,intro:t.subtitlesIntro,service:'SUBDL'},
    {title:t.setupPreferences,intro:t.preferencesIntro,service:null},
  ][setupStep];
}
function keyRequired(key){return key.required||(config.setup&&key.service===config.debrid)}
function visibleKeys(){
  if(!config.setup)return config.keys;
  const service=setupInfo().service;
  return service?config.keys.filter(key=>key.service===service):[];
}
function renderKeyCard(key){
  const card=element('section','card');card.dataset.service=key.service;
  const required=keyRequired(key),top=element('div','row'),heading=element('div','grow');
  heading.append(element('label','',key.title));
  const state=element('div','key-status'+(key.configured?'':' off'),key.configured?t.configured+' ····'+(key.last4||''):t.notConfigured);
  top.append(heading,state);card.append(top);
  const help=element('div','row'),label=element('small','',key.keyLabel+(required?' · '+t.required:'')),link=element('a','link',t.getKey);
  link.href=key.helpUrl;link.target='_blank';link.rel='noopener noreferrer';help.append(label,link);card.append(help);
  const change=keyChanges.get(key.service);
  if(change&&change.remove){
    card.append(element('p','removal',t.willRemove));
  }else{
    const input=document.createElement('input');input.type='password';input.autocomplete='new-password';input.spellcheck=false;
    input.placeholder=key.configured?t.keep:t.newValue+' · '+key.keyLabel;input.value=change&&change.value?change.value:'';
    input.setAttribute('aria-label',key.title+' · '+key.keyLabel);
    input.addEventListener('input',()=>{
      if(input.value)keyChanges.set(key.service,{service:key.service,value:input.value});else keyChanges.delete(key.service);
      const error=card.querySelector('.field-error');if(error)error.remove();setText('form-error','');
    });
    card.append(input);
  }
  if(!required){
    const actions=element('div','key-actions'),button=element('button','secondary '+(change&&change.remove?'':'danger'),change&&change.remove?t.undo:t.remove);
    button.type='button';button.addEventListener('click',()=>{if(change&&change.remove)keyChanges.delete(key.service);else keyChanges.set(key.service,{service:key.service,remove:true});render()});
    actions.append(button);card.append(actions);
  }
  return card;
}
function renderWizard(){
  const setup=config.setup;
  $('setup-wizard').classList.toggle('hidden',!setup||setupFinished);
  $('completion').classList.toggle('hidden',!setup||!setupFinished);
  $('form').classList.toggle('hidden',setupFinished);
  if(!setup)return;
  const info=setupInfo();setText('step-title',info.title);setText('step-intro',info.intro);setText('step-counter',t.step.replace('{0}',setupStep));
  const dots=$('step-dots');dots.replaceChildren();for(let i=1;i<=4;i++)dots.append(element('span','step-dot'+(i<=setupStep?' active':'')));
  $('debrid-section').classList.toggle('hidden',setupStep!==2);
  $('keys-section').classList.add('hidden');$('providers-section').classList.add('hidden');$('preferences-section').classList.add('hidden');
  $('setup-fields').classList.toggle('hidden',setupStep!==4);$('back').classList.toggle('hidden',setupStep===1);
  if(setupFinished){setText('completion-title',t.ready);setText('completion-body',t.finishOnTv);status('');}
}
function render(){
  applyLanguage();
  const select=$('debrid');select.replaceChildren();
  for(const option of config.debridOptions){const el=document.createElement('option');el.value=option.id;el.textContent=option.title;el.selected=option.id===config.debrid;select.append(el)}
  select.onchange=()=>{config.debrid=select.value;render()};
  const keys=$('keys');keys.replaceChildren();for(const key of visibleKeys())keys.append(renderKeyCard(key));
  const providers=$('providers');providers.replaceChildren();
  config.providerGroups.forEach((group,index)=>{
    const card=element('label','card check'),input=document.createElement('input');input.type='checkbox';input.checked=group.enabled;input.dataset.group=index;
    input.addEventListener('change',()=>group.enabled=input.checked);card.append(input,element('span','',group.title));providers.append(card);
  });
  const preferences=$('preferences');preferences.replaceChildren();
  for(const [id,title] of [['lightweightUi',t.lightweightUi],['experimentalSubtitleSync',t.experimentalSubtitleSync],['autoNextEpisode',t.autoNextEpisode]]){
    const card=element('label','card check'),input=document.createElement('input');input.type='checkbox';input.id='pref-'+id;input.checked=config.preferences[id];
    input.addEventListener('change',()=>config.preferences[id]=input.checked);card.append(input,element('span','',title));preferences.append(card);
  }
  if(config.setup){
    fillSelect('setup-language',[['EN','English'],['ES','Español']],config.language.toUpperCase(),value=>config.language=value.toLowerCase());
    fillSelect('setup-audio',[['ORIGINAL',t.audioOriginal],['SPANISH',t.audioSpanish],['SPANISH_ONLY',t.audioSpanishOnly]],config.setup.audio,value=>config.setup.audio=value);
    fillSelect('setup-subtitles',[['OFF',t.subtitlesOff],['SPANISH',t.subtitlesSpanish],['ENGLISH',t.subtitlesEnglish]],config.setup.subtitles,value=>config.setup.subtitles=value);
    renderWizard();
  }else{
    $('debrid-section').classList.remove('hidden');$('keys-section').classList.remove('hidden');$('providers-section').classList.remove('hidden');$('preferences-section').classList.remove('hidden');
    $('setup-fields').classList.add('hidden');$('setup-wizard').classList.add('hidden');$('completion').classList.add('hidden');$('back').classList.add('hidden');$('form').classList.remove('hidden');
  }
}
function currentStepKeyValid(){
  if(!config.setup||setupStep===3||setupStep===4)return true;
  const service=setupInfo().service,key=config.keys.find(item=>item.service===service),change=keyChanges.get(service);
  return !!(key&&(key.configured||(change&&change.value&&change.value.trim())));
}
function payload(){
  const providers=[];document.querySelectorAll('#providers input[type=checkbox]:checked').forEach(input=>providers.push(...config.providerGroups[Number(input.dataset.group)].providers));
  const service=config.setup?setupInfo().service:null;
  const keys=[...keyChanges.values()].filter(change=>!config.setup||change.service===service);
  const body={debrid:$('debrid').value,providers,lightweightUi:$('pref-lightweightUi').checked,experimentalSubtitleSync:$('pref-experimentalSubtitleSync').checked,autoNextEpisode:$('pref-autoNextEpisode').checked,keys};
  if(config.setup){body.language=$('setup-language').value;body.audio=$('setup-audio').value;body.subtitles=$('setup-subtitles').value}
  return body;
}
function showErrors(error){
  if(error.status===400&&error.body.errors){
    for(const [service,message] of Object.entries(error.body.errors)){const card=document.querySelector(`[data-service="${service}"]`);if(card)card.append(element('p','field-error',message))}
    setText('form-error',t.invalid);status(t.saveError,'error');
  }else{
    const disconnected=!error.status||error.status===401||error.status===410;
    setText('form-error',disconnected?t.network:(error.message||t.saveError));status(disconnected?t.network:t.saveError,'error');
  }
}
async function load(){
  status(t.loading);
  try{config=await api();keyChanges.clear();setupStep=1;setupFinished=false;t=config.language==='es'?spanish:english;render();status('')}
  catch(error){status(error.status===401||error.status===410?t.network:t.loadError,'error')}
}
$('back').addEventListener('click',()=>{if(saving||setupStep<=1)return;setupStep--;setText('form-error','');status('');render()});
$('form').addEventListener('submit',async event=>{
  event.preventDefault();if(saving)return;
  setText('form-error','');document.querySelectorAll('.field-error').forEach(el=>el.remove());
  if(!currentStepKeyValid()){
    const card=document.querySelector(`[data-service="${setupInfo().service}"]`);if(card)card.append(element('p','field-error',t.keyRequired));
    setText('form-error',t.keyRequired);return;
  }
  saving=true;$('save').disabled=true;$('back').disabled=true;status(t.saving);
  const body=payload(),savedServices=body.keys.map(change=>change.service),lastSetupStep=config.setup&&setupStep===4;
  try{
    config=await api({method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    savedServices.forEach(service=>keyChanges.delete(service));
    if(config.setup){if(lastSetupStep)setupFinished=true;else setupStep++}
    t=config.language==='es'?spanish:english;render();if(!setupFinished)status(t.saved,'success');
  }catch(error){showErrors(error)}finally{saving=false;$('save').disabled=false;$('back').disabled=false}
});
if(!token)status(t.pairing,'error');else load();
</script></body></html>
